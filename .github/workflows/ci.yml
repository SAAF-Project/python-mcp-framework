name: Offline MCP starter checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: mcp-starter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: windows-2025
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install hash-locked CI tooling
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Install the existing dependency lock
        run: uv sync --locked --python ${{ matrix.python }}
      - run: uv pip check
      - name: Offline tests
        run: uv run --offline --locked pytest -q --junitxml=test-results.xml
      - name: Offline lint
        run: uv run --offline --locked ruff check .
      - name: Real local stdio round trip
        run: uv run --offline --locked python scripts/smoke_test.py --expect-empty
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml
          if-no-files-found: error
          retention-days: 14
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: target
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: SAAF-Project/saaf-living-map
          ref: 068ad51d476ae7090cd4abb8bf395be82e4b2f90
          path: living-map
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r target/requirements-ci.txt
      - name: Validate using existing Living Map rules
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('living_map', 'living-map/scripts/build_map.py')
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)
          entry = validator.entry('SAAF-Project/python-mcp-framework', Path('target/agent.yaml').read_text(), 'local', 'repo')
          assert not entry['warnings'], entry['warnings']
          assert entry['has_mandate']
          assert entry['confirmed'] is False
          print('Manifest valid; confirmed:', entry['confirmed'])
          PY
